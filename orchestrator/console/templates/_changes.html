<div id="changes-body">
{% if not changes %}<div class="empty">還沒有從控制台或 --migrate 改過任何值。</div>{% else %}
<table class="tbl">
  <tr><th>時間</th><th>誰</th><th>鍵</th><th>舊 → 新</th></tr>
  {% for c in changes %}
  <tr>
    <td class="faint">{{ c.ts | int | datetime }}</td>
    <td>{{ c.actor }}</td>
    <td><code>{{ c.env }}</code></td>
    <td class="v"><span class="mono">{{ c.old }}</span> → <span class="mono">{{ c.new }}</span></td>
  </tr>
  {% endfor %}
</table>{% endif %}
</div>
