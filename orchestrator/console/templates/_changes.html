<div id="changes-body">
{% if not changes %}<div class="empty">尚無變更紀錄。</div>{% else %}
<table class="tbl">
  <tr><th>時間</th><th>來源</th><th>變數</th><th>舊值 → 新值</th></tr>
  {% for c in changes %}
  <tr>
    <td class="faint">{{ c.ts | int | datetime }}</td>
    <td>{{ c.actor }}</td>
    <td><code>{{ c.env }}</code></td>
    <td class="v"><span class="mono">{{ c.old }}</span> → <span class="mono">{{ c.new }}</span></td>
  </tr>
  {% endfor %}
</table>{% endif %}
</div>
