spring.application.name=orders

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/orders
spring.datasource.username=${DB_USER:orders}
spring.datasource.password=${DB_PASSWORD:orders}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

orders.nats.url=nats://${NATS_HOST:localhost}:4222
orders.pricing.base-url=http://pricing.internal.example:8080
orders.scheduling.enabled=true
orders.outbox.delay-ms=1000
orders.closing.cron=0 0 2 * * *
