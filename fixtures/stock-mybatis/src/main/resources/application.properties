spring.application.name=stock

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/stock
spring.datasource.username=${DB_USER:stock}
spring.datasource.password=${DB_PASSWORD:stock}
spring.sql.init.mode=always

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

stock.hold-minutes=30
stock.scheduling.enabled=true
stock.expiry.cron=0 */5 * * * *
