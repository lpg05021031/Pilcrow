<div class="tx-root" id="tx-root">
  <div class="tx-scale" id="tx-scale">
    <div class="tx-stage tx-rise" id="tx-stage"><div id="tx-over"></div><div id="tx-card"></div><div id="tx-cite"></div></div>
    <div class="tx-dock tx-rise" id="tx-dock">
      <div class="tx-main">
        <div class="tx-meta"><span class="tx-num" id="tx-num"></span><span class="tx-chap" id="tx-chap"></span><span class="tx-segs" id="tx-segs"></span><span class="tx-hint" id="tx-hint"></span></div>
      </div>
      <div class="tx-up" id="tx-up"></div>
      <div class="tx-keys" id="tx-keys"></div>
      <div class="tx-nav">
        <button data-tx="prev" id="tx-prev" aria-label="上一步"></button>
        <button class="tx-next" data-tx="next" id="tx-next" aria-label="下一步"></button>
      </div>
    </div>
    <div id="tx-rings"></div>
    <div id="tx-cursor"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M5 3l15 9.2-6.6 1.3 3.7 7.4-3.1 1.5-3.7-7.5L5 19.6z" fill="#16161a" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
    <div id="tx-keycap"></div>
    <div id="tx-notes" role="note"></div>
    <div id="tx-toast" role="status"></div>
    <div id="tx-pal"></div>
  </div>
</div>
